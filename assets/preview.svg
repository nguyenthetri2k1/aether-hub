    <rect x="596" y="388" width="252" height="132" rx="14" fill="#07161d" stroke="#0e3a4a"/>
    <rect x="612" y="404" width="44" height="44" rx="12" fill="#0e2a37"/>
    <text x="624" y="433" fill="#22d3ee" font-family="Consolas, monospace" font-size="18">AF</text>
    <text x="672" y="426" fill="#ecfeff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Anti-AFK</text>
    <text x="672" y="448" fill="#5d8ca3" font-family="Segoe UI, Arial, sans-serif" font-size="12">Utility</text>
    <text x="612" y="486" fill="#9fd8e8" font-family="Segoe UI, Arial, sans-serif" font-size="12">Keeps the session alive.</text>
    <text x="612" y="506" fill="#22d3ee" font-family="Consolas, monospace" font-size="12">antiafk.lua</text>
  </g>
  <g>
    <rect x="864" y="388" width="252" height="132" rx="14" fill="#07161d" stroke="#0e3a4a"/>
    <rect x="880" y="404" width="44" height="44" rx="12" fill="#0e2a37"/>
    <text x="892" y="433" fill="#22d3ee" font-family="Consolas, monospace" font-size="18">TP</text>
    <text x="940" y="426" fill="#ecfeff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Teleport</text>
    <text x="940" y="448" fill="#5d8ca3" font-family="Segoe UI, Arial, sans-serif" font-size="12">Utility</text>
    <text x="880" y="486" fill="#9fd8e8" font-family="Segoe UI, Arial, sans-serif" font-size="12">Move to the mouse target.</text>
    <text x="880" y="506" fill="#22d3ee" font-family="Consolas, monospace" font-size="12">teleport.lua</text>
