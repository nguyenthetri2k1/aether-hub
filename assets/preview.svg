  <rect x="328" y="552" width="788" height="1" fill="#0e3a4a"/>
  <text x="328" y="590" fill="#5d8ca3" font-family="Segoe UI, Arial, sans-serif" font-size="13">All scripts are plain Lua, reviewed for readability, and safe to inspect before use.</text>
  <text x="328" y="616" fill="#5d8ca3" font-family="Segoe UI, Arial, sans-serif" font-size="13">No obfuscation. No external loaders. No hidden requests.</text>
