  <text x="1160" y="87" fill="#5d8ca3" font-family="Consolas, monospace" font-size="14" text-anchor="end">v1.0.0</text>

  <rect x="72" y="136" width="220" height="592" rx="16" fill="#07161d" stroke="#0e3a4a"/>
