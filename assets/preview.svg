    <rect x="344" y="404" width="44" height="44" rx="12" fill="#0e2a37"/>
    <text x="356" y="433" fill="#22d3ee" font-family="Consolas, monospace" font-size="18">FL</text>
    <text x="404" y="426" fill="#ecfeff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Fly</text>
    <text x="404" y="448" fill="#5d8ca3" font-family="Segoe UI, Arial, sans-serif" font-size="12">Movement</text>
